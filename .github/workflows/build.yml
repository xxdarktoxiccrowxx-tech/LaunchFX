name: Build desktop apps
on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Check Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'native/windows/window.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - name: Check release version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: pnpm dist:mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: pnpm dist:win --publish never
      - run: pnpm verify:packages
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchFX-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LaunchFX-*
          path: packages
          merge-multiple: true
      - name: Generate checksums
        working-directory: packages
        run: sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/*
