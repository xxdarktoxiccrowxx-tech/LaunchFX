# Public release publishing is paused until the maintainer explicitly resumes it.
name: Build desktop apps
on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Check Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'native/windows/window.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: pnpm dist:mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: pnpm dist:win --publish never
      - run: pnpm verify:packages
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchFX-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
